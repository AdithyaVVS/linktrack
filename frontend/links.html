<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinkTrack - My Links</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <span class="brand">LinkTrack</span>
    <a href="index.html">Create</a>
    <a href="links.html" class="active">My Links</a>
  </nav>

  <main>
    <div class="card">
      <h1>My links</h1>
      <div id="error" class="message error" hidden></div>
      <p id="empty" class="muted" hidden>No links yet. Create one on the Create page.</p>
      <table id="links-table" hidden>
        <thead>
          <tr>
            <th>Short link</th>
            <th>Original URL</th>
            <th>Clicks</th>
            <th>Status</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="links-body"></tbody>
      </table>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/links.js"></script>
</body>
</html>
